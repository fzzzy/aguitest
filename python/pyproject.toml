[project]
name = "aguitest"
version = "0.1.0"
description = "Learning AGUI (Agent User Interaction Protocol) SDK"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ag-ui-protocol>=0.1.21",
    "fastapi>=0.141.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic-ai-slim[ag-ui,bedrock,google,openai]>=2.35.3",
    "pillow>=12.3.0",
    "simpleeval>=1.0.7",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.5",
    "pytest-asyncio>=1.4.0",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.9.0"
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
# Ignore DeprecationWarning from google-genai 1.68.0 upstream bug
filterwarnings = [
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]

[tool.ruff.lint]
extend-select = ["PLC0415"]
